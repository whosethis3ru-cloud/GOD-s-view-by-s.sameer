<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      viewport-fit=cover">

<meta name="theme-color" content="#07070a">

<title>GOD'S view by sameer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header>
    <h1>GOD'S view by sameer</h1>
    <p>Create • Depth • Tilt</p>
</header>


<section class="panel">

    <div id="stage" class="stage">

        <div id="empty" class="empty">
            <div>
                <strong>Upload your images</strong>
                <br><br>
                Add 3–5 images as separate layers.
                <br><br>
                Background → middle → foreground
            </div>
        </div>

        <div id="hint" class="hint">
            Upload images to begin
        </div>

    </div>


    <div id="uploads" class="uploads"></div>


    <button id="motion" class="primary">
        Enable phone tilt
    </button>


    <div id="layerControls"
         class="layer-controls">
    </div>


    <button id="reset">
        Reset artwork
    </button>

</section>


<footer>
    GOD'S view by sameer
</footer>

</div>


<script src="app.js"></script>

</body>
</html>
